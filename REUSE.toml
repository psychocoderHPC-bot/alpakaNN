version = 1
SPDX-PackageName = "alpakaNN"
SPDX-PackageSupplier = "Person: René Widera"
SPDX-PackageDownloadLocation = "https://github.com/psychocoderHPC/alpakaNN"

[[annotations]]
path = [
    "example/heatEquationNn/CMakeLists.txt",
    "example/heatEquationNn/README.md",
    "example/heatEquationNn/src/*.hpp",
    "example/heatEquationNn/src/*.cpp",
    "example/heatEquationNn/test/*.cpp",
    "docs/*.md",
    "models/heat_closure/*",
    "presentation_notes.md",
    "results/heat_closure/nhc-20261001/figures/manifest.json",
    "validation_report.md",
    "tools/*.py",
    "tools/tests/*.py",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "René Widera"
SPDX-License-Identifier = "MPL-2.0"

[[annotations]]
path = [
    ".clang-format",
    ".gersemirc",
    ".pre-commit-config.yaml",
    "CMakePresets.json",
    "README.md",
    "REUSE.toml",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "René Widera"
SPDX-License-Identifier = "MPL-2.0"

[[annotations]]
path = ["LICENSE", "LICENSES/MPL-2.0.txt"]
precedence = "aggregate"
SPDX-FileCopyrightText = "René Widera"
SPDX-License-Identifier = "MPL-2.0"
